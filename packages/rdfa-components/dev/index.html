<html data-color-scheme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RDFa Components Playground</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root { font-family: "Inter", system-ui, sans-serif; color: #0f172a; background: #f8fafc; }
      body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 1.5rem; background: #f8fafc; }
      main { width: min(960px, 100%); background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1.25rem; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
      h1 { margin: 0; font-size: 1.35rem; }
      p { margin: 0.4rem 0 1rem; color: #475569; }
      label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
      textarea, pre, .panel { width: 100%; border: 1px solid #e5e7eb; border-radius: 10px; background: #f8fafc; padding: 0.8rem; color: inherit; }
      textarea { min-height: 220px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 0.95rem; line-height: 1.4; resize: vertical; }
      pre { white-space: pre-wrap; word-break: break-word; overflow: auto; }
      .panel { min-height: 160px; overflow: auto; word-break: break-word; }
      select, button { padding: 0.55rem 0.7rem; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; cursor: pointer; }
      .header { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
      .header select, .header button { min-width: 120px; width: auto; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0.9rem; margin-top: 0.9rem; align-items: start; }
      .grid > div { min-width: 0; }
      .status { font-size: 0.9rem; color: #2563eb; }

      @media (max-width: 720px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RDF → RDFa playground</h1>
      <p>Paste RDF (Turtle, TriG, N-Triples, N-Quads), convert to RDFa HTML, and inspect extracted subjects.</p>

      <div class="header">
        <label for="format">Format</label>
        <select id="format">
          <option value="turtle">turtle</option>
          <option value="trig">trig</option>
          <option value="n-triples">n-triples</option>
          <option value="n-quads">n-quads</option>
        </select>
        <button id="convert">Convert</button>
        <span id="status" class="status"></span>
      </div>

      <label for="input">RDF input</label>
      <textarea id="input"></textarea>

      <div class="grid">
        <div>
          <label>RDFa HTML output</label>
          <pre id="htmlOutput"></pre>
        </div>
        <div>
          <label>Live preview</label>
          <div id="preview" class="panel"></div>
        </div>
      </div>

      <div class="grid">
        <div>
          <label>Extracted RDFa subjects</label>
          <pre id="subjectsOutput"></pre>
        </div>
      </div>
    </main>

    <script type="module" src="./frontend.ts"></script>
  </body>
</html>
